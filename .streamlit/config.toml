[theme]
base = "light"
primaryColor = "#10b981"
backgroundColor = "#f8fafc"
secondaryBackgroundColor = "#ffffff"
textColor = "#0f172a"
font = "sans serif"

[server]
enableStaticServing = true
headless = true

[client]
toolbarMode = "minimal"
showErrorDetails = false

[browser]
gatherUsageStats = false
